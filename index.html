<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060208">
<title>&#9829;</title>
<style>
  html, body { margin: 0; height: 100%; background: #060208; overflow: hidden;
               -webkit-tap-highlight-color: transparent; }
  canvas { display: block; width: 100%; height: 100%; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column;
           align-items: center; justify-content: center; gap: 18px;
           background: #060208; cursor: pointer; transition: opacity .9s ease;
           font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
           color: #ffd9e0; user-select: none; -webkit-user-select: none; }
  #start.hide { opacity: 0; pointer-events: none; }
  #start .h { font-size: 84px; line-height: 1; color: #ff1f4b;
              text-shadow: 0 0 28px rgba(255, 31, 75, .65);
              animation: beat 1.1s infinite; }
  #start .t { font-size: 16px; letter-spacing: .08em; opacity: .75; }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    10% { transform: scale(1.16); }
    22% { transform: scale(1); }
    32% { transform: scale(1.1); }
    45% { transform: scale(1); }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="start"><div class="h">&#9829;</div><div class="t" id="startText"></div></div>
<noscript><p style="color:#ffd9e0;text-align:center;font-family:sans-serif">&#9829;</p></noscript>

<script>
(() => {
  // =============================== SETTINGS ===============================
  const NAME = "Riham";            // big text in the middle ("" = none)
  const SECRET = "";          // your special number ("" = none)
  const DATES = [];   // two dates that merge into SECRET ([] = no effect)
  const START_TEXT = "Dghet 3la l-qalb";

  const BG = "#060208", GOLD = "#ffcf8a", PINK = "#ffd9e0", HEART = "\u2665";
  const COLORS = ["#ff1f4b", "#e8153f", "#d11236", "#ff4d6d", "#c20f31",
                  "#f02c52", "#ff6b81", "#b30d2c"];
  const SIZES = [9, 10, 11, 12, 13];  // base font sizes (px), scaled to the screen
  const GAP = 7;                      // minimum gap between words
  const DURATION = 10000;             // ms until every word has appeared
  const ITEM_MS = 700;                // ms each word takes to fade in
  const LIFT = 30;                    // px each word rises while appearing
  const PULSE = 0.028;                // heartbeat strength (0 = off)
  const BEAT_MS = 1100;
  const FLOATING_HEARTS = true;

  const WORDS = [
    "Kanbghik", "I love you", "Je t'aime", "Te amo", "Ti amo",
    "Ich liebe dich", "Te quiero", "Eu te amo", "Jag älskar dig",
    "Ik hou van je", "Seni seviyorum", "Aku cinta kamu", "Kocham cię",
    "Я тебя люблю", "Я тебе кохаю", "我爱你", "愛してる", "사랑해",
    "मैं तुमसे प्यार करता हूँ", "Σ' αγαπώ", "Mahal kita", "Anh yêu em",
    "Te iubesc", "Rakastan sinua", "Jeg elsker deg", "Jeg elsker dig",
    "Szeretlek", "Miluji tě", "Volim te", "Te dua", "Ngiyakuthanda",
    "Nakupenda", "Mi amas vin", "ฉันรักคุณ", "আমি তোমাকে ভালোবাসি",
    "Ana bahebbak", "Ti amo tanto", "Je t'aime fort", "Aloha au iā 'oe",
    "كنبغيك", "أحبك", "ريهام", "دوستت دارم", "אני אוהב אותך"
  ];
  if (NAME) WORDS.push(NAME, NAME, "Kanbghik " + NAME);
  if (SECRET) WORDS.push(SECRET, SECRET, SECRET);

  // ============================== HEART MATH ==============================
  const inHeart = (u, v) => Math.pow(u * u + v * v - 1, 3) - u * u * v * v * v <= 0;
  let UMIN = 9, UMAX = -9, VMIN = 9, VMAX = -9;
  for (let u = -1.6; u <= 1.6; u += 0.01) {
    for (let v = -1.4; v <= 1.7; v += 0.01) {
      if (inHeart(u, v)) {
        if (u < UMIN) UMIN = u; if (u > UMAX) UMAX = u;
        if (v < VMIN) VMIN = v; if (v > VMAX) VMAX = v;
      }
    }
  }
  const V0 = 0.35;

  function outlinePoints(cx, cy, scale, spacing, push, n = 720) {
    const pts = [];
    for (let k = 0; k < n; k++) {
      const a = 2 * Math.PI * k / n, ca = Math.cos(a), sa = Math.sin(a);
      let r = 0;
      while (r < 3 && inHeart(r * ca, V0 + r * sa)) r += 0.01;
      let lo = Math.max(r - 0.01, 0), hi = r;
      for (let i = 0; i < 18; i++) {
        const mid = (lo + hi) / 2;
        if (inHeart(mid * ca, V0 + mid * sa)) lo = mid; else hi = mid;
      }
      pts.push([cx + lo * ca * scale, cy - (V0 + lo * sa) * scale]);
    }
    const ox = cx, oy = cy - V0 * scale;
    let pushed = pts.map(([x, y]) => {
      const dx = x - ox, dy = y - oy, L = Math.hypot(dx, dy) || 1;
      return [x + push * dx / L, y + push * dy / L];
    });
    const s = Math.floor(3 * n / 4);               // start at the bottom tip
    pushed = pushed.slice(s).concat(pushed.slice(0, s));
    const closed = pushed.concat([pushed[0]]);
    const seg = [];
    let total = 0;
    for (let i = 0; i < n; i++) {
      const d = Math.hypot(closed[i + 1][0] - closed[i][0], closed[i + 1][1] - closed[i][1]);
      seg.push(d); total += d;
    }
    const m = Math.max(8, Math.floor(total / spacing)), step = total / m;
    const res = [];
    let i = 0, acc = 0;
    for (let j = 0; j < m; j++) {
      const target = j * step;
      while (i < n - 1 && acc + seg[i] < target) { acc += seg[i]; i++; }
      const f = (target - acc) / (seg[i] || 1);
      res.push([closed[i][0] + (closed[i + 1][0] - closed[i][0]) * f,
                closed[i][1] + (closed[i + 1][1] - closed[i][1]) * f]);
    }
    return res.map((p, j) => {
      const p0 = res[(j - 1 + m) % m], p1 = res[(j + 1) % m];
      let a = Math.atan2(p1[1] - p0[1], p1[0] - p0[0]);
      while (a > Math.PI / 2) a -= Math.PI;          // keep the text upright
      while (a <= -Math.PI / 2) a += Math.PI;
      return { x: p[0], y: p[1], rot: a, frac: j / m };
    });
  }

  // ================================ SETUP ================================
  const cv = document.getElementById("c");
  const ctx = cv.getContext("2d");
  const startEl = document.getElementById("start");
  document.getElementById("startText").textContent = START_TEXT;

  const FONT_STACK = '"Segoe UI","Helvetica Neue",Arial,"Noto Sans","Noto Sans Arabic","Noto Sans CJK SC",sans-serif';
  const font = (size, bold) => (bold ? "700 " : "400 ") + size + "px " + FONT_STACK;
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const smooth = p => p * p * (3 - 2 * p);

  const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const mix = (c1, c2, t) => {
    t = clamp(t, 0, 1);
    const a = hex(c1), b = hex(c2);
    return "rgb(" + a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(",") + ")";
  };

  let W = 0, H = 0, items = [], geo = null, special = {};
  const measureCache = new Map();
  function measure(text, size, bold) {
    const key = text + "|" + size + "|" + bold;
    let w = measureCache.get(key);
    if (w === undefined) {
      ctx.font = font(size, bold);
      w = ctx.measureText(text).width;
      measureCache.set(key, w);
    }
    return w;
  }

  function wordColor(text) {
    if (SECRET && text === SECRET) return GOLD;
    if (NAME && text.indexOf(NAME) !== -1) return PINK;
    return pick(COLORS);
  }

  function build() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    measureCache.clear();

    const m = Math.max(28, Math.min(W, H) * 0.055);   // room for the ring
    const scale = Math.min((W - 2 * m) / (UMAX - UMIN), (H - 2 * m) / (VMAX - VMIN));
    const cx = W / 2 - scale * (UMAX + UMIN) / 2;
    const cy = H / 2 + scale * (VMAX + VMIN) / 2;
    const inside = (x, y) => inHeart((x - cx) / scale, (cy - y) / scale);
    const ts = clamp(scale / 330, 0.85, 1.6);          // text scale
    const sizes = SIZES.map(s => s * ts);
    geo = { cx, cy, scale, mx: cx, my: cy - 0.3 * scale, inside, ts };

    items = []; special = {};
    const total = DURATION - ITEM_MS;

    // ---- centre block: name + number (+ dates that merge into it) ----
    const nameSize = clamp(scale * 0.115, 20, 52);
    const secretSize = nameSize * 0.58;
    const merge = !!(SECRET && DATES.length === 2);
    const blocks = [];
    if (NAME) blocks.push({ kind: "name", text: NAME, size: nameSize, color: PINK });
    if (SECRET) blocks.push({ kind: "secret", text: SECRET, size: secretSize, color: GOLD });
    let hole = null;
    if (blocks.length) {
      const lh = s => s * 1.3, gap = 6;
      let bw = Math.max(...blocks.map(b => measure(b.text, b.size, true)));
      let spread = scale * 0.19;
      if (merge) {
        const dw = Math.max(measure(DATES[0], secretSize, true), measure(DATES[1], secretSize, true));
        spread = Math.max(spread, dw * 0.7 + 6);
        bw = Math.max(bw, 2 * spread + dw);
      }
      const bh = blocks.reduce((a, b) => a + lh(b.size), 0) + gap * (blocks.length - 1);
      let y = cy - 0.12 * scale - bh / 2;
      const top = y;
      for (const b of blocks) {
        const yc = y + lh(b.size) / 2;
        const it = { kind: b.kind, text: b.text, size: b.size, bold: true, x: cx, y: yc,
                     color: b.color, order: 1, driven: b.kind === "secret" && merge };
        items.push(it);
        if (it.driven) {
          special.secret = it;
          special.spread = spread;
          special.d1 = { kind: "d1", text: DATES[0], size: b.size, bold: true, x: cx - spread, y: yc, color: GOLD, driven: true };
          special.d2 = { kind: "d2", text: DATES[1], size: b.size, bold: true, x: cx + spread, y: yc, color: GOLD, driven: true };
        }
        y += lh(b.size) + gap;
      }
      hole = [cx - bw / 2 - 20 * ts, cx + bw / 2 + 20 * ts, top - 9 * ts, top + bh + 9 * ts];
    }

    // ---- ring around the heart: the number if there is one, otherwise little hearts ----
    {
      const ringText = SECRET ? SECRET + " " + HEART : HEART;
      const ringSize = (SECRET ? 9 : 12) * ts;
      const ringColor = SECRET ? GOLD : "#ff4d6d";
      const spacing = measure(ringText, ringSize, false) + (SECRET ? 16 : 9) * ts;
      for (const p of outlinePoints(cx, cy, scale, spacing, Math.max(9, scale * 0.042))) {
        items.push({ kind: "ring", text: ringText, size: ringSize, bold: false, x: p.x, y: p.y,
                     rot: p.rot, color: ringColor, order: p.frac * 0.35, driven: false });
      }
    }

    // ---- the words that fill the heart ----
    const rowH = Math.max(...sizes) * 1.25 + 2;
    const top = cy - VMAX * scale, bottom = cy - VMIN * scale;
    const nRows = Math.floor((bottom - top) / rowH);
    const y0 = top + ((bottom - top) - nRows * rowH) / 2;
    const gapPx = GAP * ts;
    const words = [];
    let prev = null;
    for (let r = 0; r < nRows; r++) {
      const y = y0 + r * rowH + rowH / 2, half = rowH * 0.45;
      const runs = [];
      let start = null;
      for (let x = 0; x <= W; x += 2) {
        let ok = inside(x, y) && inside(x, y - half) && inside(x, y + half);
        if (ok && hole && x >= hole[0] && x <= hole[1] && y >= hole[2] && y <= hole[3]) ok = false;
        if (ok && start === null) start = x;
        else if (!ok && start !== null) { runs.push([start, x - 2]); start = null; }
      }
      if (start !== null) runs.push([start, W]);

      for (const [x0, x1] of runs) {
        const avail = x1 - x0;
        if (avail < 50 * ts) continue;
        const row = [];
        let used = 0;
        for (;;) {
          let placed = false;
          for (let tries = 0; tries < 8; tries++) {
            const text = pick(WORDS);
            if (text === prev) continue;
            const size = pick(sizes), w = measure(text, size, false);
            const need = w + (row.length ? gapPx : 0);
            if (used + need <= avail) {
              row.push({ text, size, w }); used += need; prev = text; placed = true; break;
            }
          }
          if (!placed) break;
        }
        if (!row.length) continue;
        const leftover = avail - row.reduce((a, b) => a + b.w, 0);
        let gap, x;
        if (row.length > 1) { gap = leftover / (row.length - 1); x = x0; }
        else { gap = 0; x = x0 + leftover / 2; }
        for (const wd of row) {
          words.push({ kind: "word", text: wd.text, size: wd.size, bold: false,
                       x: x + wd.w / 2, y, color: wordColor(wd.text), driven: false });
          x += wd.w + gap;
        }
      }
    }
    // reveal order: from the centre outwards, with some randomness
    const keys = words.map(w => Math.hypot(w.x - W / 2, (w.y - H / 2) * 1.1) + Math.random() * 70 * ts);
    const lo = Math.min(...keys), hi = Math.max(...keys);
    words.forEach((w, i) => { w.order = 0.2 + 0.8 * (keys[i] - lo) / ((hi - lo) || 1); });
    items = items.concat(words);
    for (const it of items) if (!it.driven) it.start = it.order * total;
  }

  // ============================== ANIMATION ==============================
  let clock = 0, last = null, running = false;
  let hearts = [], lastHeart = 0, lastSpark = 0;
  const beatK = ms => {
    const t = (ms % BEAT_MS) / BEAT_MS;
    return 1 + PULSE * (Math.exp(-Math.pow((t - 0.10) / 0.05, 2)) +
                        0.65 * Math.exp(-Math.pow((t - 0.30) / 0.06, 2)));
  };

  function drawItem(it, alpha, y, color) {
    if (alpha <= 0.005) return;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color || it.color;
    ctx.font = font(it.size, it.bold);
    if (it.rot) {
      ctx.save(); ctx.translate(it.x, y); ctx.rotate(it.rot);
      ctx.fillText(it.text, 0, 0); ctx.restore();
    } else {
      ctx.fillText(it.text, it.x, y);
    }
  }

  function frame(now) {
    requestAnimationFrame(frame);
    if (last === null) last = now;
    const dt = Math.min(now - last, 100);
    last = now;
    if (running) clock += dt;
    render(clock);
  }

  function render(t) {
    ctx.setTransform(Math.min(window.devicePixelRatio || 1, 3), 0, 0, Math.min(window.devicePixelRatio || 1, 3), 0, 0);
    ctx.globalAlpha = 1;
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, W, H);
    if (!geo) return;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    const revealEnd = DURATION;
    const after = t - revealEnd;               // ms since every word appeared
    const k = after > 0 && PULSE ? beatK(after) : 1;
    const glowA = clamp(t / 3000, 0, 1) * (0.55 + (k - 1) * 6);

    // soft glow behind the heart
    const g = ctx.createRadialGradient(geo.mx, geo.my, 0, geo.mx, geo.my, geo.scale * 1.35);
    g.addColorStop(0, "rgba(110,12,48," + (0.55 * glowA).toFixed(3) + ")");
    g.addColorStop(1, "rgba(110,12,48,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    // sparkles on random words
    if (after > 0 && t - lastSpark > 70) {
      lastSpark = t;
      const w = items[Math.floor(Math.random() * items.length)];
      if (w && w.kind === "word") w.flash = t + 230;
    }

    // words + ring (they beat together)
    ctx.save();
    ctx.translate(geo.mx, geo.my); ctx.scale(k, k); ctx.translate(-geo.mx, -geo.my);
    for (const it of items) {
      if (it.driven || it.kind === "name" || it.kind === "secret") continue;
      const p = (t - it.start) / ITEM_MS;
      if (p <= 0) continue;
      const e = 1 - Math.pow(1 - Math.min(p, 1), 3);
      const flashing = it.flash && it.flash > t;
      drawItem(it, e, it.y + LIFT * (1 - e), flashing ? "#ffffff" : null);
    }
    ctx.restore();

    // centre: name, number, and the two dates that merge into it
    for (const it of items) {
      if (it.kind !== "name" && !(it.kind === "secret" && !it.driven)) continue;
      const p = (t - it.start) / ITEM_MS;
      drawItem(it, 1 - Math.pow(1 - clamp(p, 0, 1), 3), it.y);
    }
    if (special.secret) {
      const f = after - 400;
      const { d1, d2, secret, spread } = special;
      if (f > 0) {
        let dAlpha = 0, sAlpha = 0, x1 = d1.x, x2 = d2.x, sColor = GOLD;
        if (f <= 1700) {
          dAlpha = clamp(f / 600, 0, 1);
        } else if (f <= 2700) {
          const p = (f - 1700) / 1000, e = smooth(p);
          x1 = geo.cx - spread * (1 - e); x2 = geo.cx + spread * (1 - e);
          dAlpha = p > 0.5 ? 1 - (p - 0.5) / 0.5 : 1;
          sAlpha = clamp((p - 0.55) / 0.45, 0, 1);
        } else {
          sAlpha = 1;
          sColor = mix("#ffffff", GOLD, (f - 2700) / 900);
        }
        if (dAlpha > 0) {
          drawItem(Object.assign({}, d1, { x: x1 }), dAlpha, d1.y);
          drawItem(Object.assign({}, d2, { x: x2 }), dAlpha, d2.y);
        }
        drawItem(secret, sAlpha, secret.y, sColor);
      }
    }

    // floating hearts
    if (FLOATING_HEARTS && after > 0) {
      if (t - lastHeart > 450 && hearts.length < 24) {
        lastHeart = t;
        for (let i = 0; i < 40; i++) {
          const x = geo.cx + (Math.random() * 2 - 1) * geo.scale * 1.1;
          const y = geo.cy - (VMIN + Math.random() * (VMAX - VMIN)) * geo.scale;
          if (geo.inside(x, y)) {
            hearts.push({ x, y, born: t, size: (10 + Math.random() * 8) * geo.ts });
            break;
          }
        }
      }
      hearts = hearts.filter(h => t - h.born < 2400);
      for (const h of hearts) {
        const p = (t - h.born) / 2400;
        ctx.globalAlpha = Math.sin(Math.PI * p) * 0.9;
        ctx.fillStyle = "#ff5c7a";
        ctx.font = font(h.size, false);
        ctx.fillText(HEART, h.x, h.y - geo.scale * 0.25 * p);
      }
    }
    ctx.globalAlpha = 1;
  }

  function begin() {
    clock = 0; hearts = []; lastHeart = 0; lastSpark = 0;
    for (const it of items) delete it.flash;
    running = true;
  }

  // start screen: one tap and it begins (so she sees it from the very first second)
  startEl.addEventListener("click", () => {
    startEl.classList.add("hide");
    begin();
  });
  // after the end, a tap replays it
  cv.addEventListener("click", () => {
    if (running && clock > DURATION + 5000) begin();
  });

  let resizeTimer = null;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(build, 150);
  });

  build();
  requestAnimationFrame(frame);

  // tiny hook used only for testing screenshots
  window.__love = { seek(ms) { startEl.classList.add("hide"); running = false; clock = ms; hearts = []; lastHeart = ms - 5000; render(ms); } };
})();
</script>
</body>
</html>
